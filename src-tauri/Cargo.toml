[package]
name = "lightproxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightProxy tray proxy switcher"

[lib]
name = "lightproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
lightproxy-core = { path = "../crates/core" }
lightproxy-update = { path = "../crates/update" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "config-json5"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
